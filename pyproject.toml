[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy_basketball"
version = "0.1.0"
description = "Fantasy basketball player data analysis"
readme = "README.md"
authors = [{ name = "Sanjay Manoj" }]
requires-python = ">=3.12"
dependencies = [
    "nba_api==1.11.4",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "requests==2.34.2",
    "tqdm==4.68.4",
    "scipy>=1.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=fantasy_basketball --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# Just use the package name here, not the path
source = ["fantasy_basketball"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]